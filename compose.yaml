services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scaniq
      POSTGRES_USER: scaniq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scaniq_local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scaniq -d scaniq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: "postgresql://scaniq:${POSTGRES_PASSWORD:-scaniq_local}@db:5432/scaniq?schema=public"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      AI_API_KEY: ${AI_API_KEY:?Set AI_API_KEY in the root .env file}
      AI_MODEL: ${AI_MODEL:-gemini-2.0-flash}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000/api/v1
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres-data:
